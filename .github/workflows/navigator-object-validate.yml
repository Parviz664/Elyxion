name: Navigator Object Validate

on:
  push:
    branches:
      - channel/elyxion-ufo-navigator-v0.1
    paths:
      - "channels/elyxion-ufo-navigator/NAV_OBJECT_SCHEMA_V0_2.json"
      - "channels/elyxion-ufo-navigator/NAV_OBJECT_REGISTRY_V0_2.json"
      - "channels/elyxion-ufo-navigator/NAV_GLOBAL_C0_RECOVERY_LADDER_V0_1.json"
      - "channels/elyxion-ufo-navigator/tests/NAV_OBJECT_FALSIFICATION_CASES_V0_1.json"
      - "channels/elyxion-ufo-navigator/tools/validate_nav_objects.py"
      - ".github/workflows/navigator-object-validate.yml"
  pull_request:
    paths:
      - "channels/elyxion-ufo-navigator/NAV_OBJECT_SCHEMA_V0_2.json"
      - "channels/elyxion-ufo-navigator/NAV_OBJECT_REGISTRY_V0_2.json"
      - "channels/elyxion-ufo-navigator/NAV_GLOBAL_C0_RECOVERY_LADDER_V0_1.json"
      - "channels/elyxion-ufo-navigator/tests/NAV_OBJECT_FALSIFICATION_CASES_V0_1.json"
      - "channels/elyxion-ufo-navigator/tools/validate_nav_objects.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Navigator object graph substrate
        run: python channels/elyxion-ufo-navigator/tools/validate_nav_objects.py
