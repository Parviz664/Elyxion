name: Navigator Substrate Validate

on:
  push:
    branches:
      - channel/elyxion-ufo-navigator-v0.1
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  pull_request:
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Navigator substrate
        run: python channels/elyxion-ufo-navigator/tools/validate_nav_substrate_v0_4.py
      - name: Test merged Navigator catalogs
        run: python channels/elyxion-ufo-navigator/tools/test_nav_catalog.py
      - name: Test bounded context slices
        run: python channels/elyxion-ufo-navigator/tools/test_context_slice.py
      - name: Test claim-aware context packs
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack.py
      - name: Test targeted context-pack invalidation
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack_invalidation.py
      - name: Test bounded evidence materialization
        run: python channels/elyxion-ufo-navigator/tools/test_materialize_evidence.py
      - name: Test receipts sufficiency and targeted repair
        run: python channels/elyxion-ufo-navigator/tools/test_receipt_and_repair.py
      - name: Test targeted context-pack repair planner
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack_repair.py
      - name: Test verification dependency index regeneration
        run: python channels/elyxion-ufo-navigator/tools/test_verification_dependency_index.py
      - name: Test existing Global C0 handoff envelope
        run: python channels/elyxion-ufo-navigator/tools/test_global_c0_handoff.py
      - name: Falsify Global C0 handoff blocking states
        run: python channels/elyxion-ufo-navigator/tools/test_global_c0_handoff_blocking.py
      - name: Test existing Global C0 cold-start export
        run: python channels/elyxion-ufo-navigator/tools/test_global_c0_cold_start_export.py
      - name: Test O0 sector-level orientation
        run: python channels/elyxion-ufo-navigator/tools/test_global_orientation_o0.py
      - name: Test normalized semantic coverage boundary
        run: python channels/elyxion-ufo-navigator/tools/test_semantic_coverage.py
      - name: Test O1 role-boundary capsules
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules.py
      - name: Test O1 role-boundary capsules batch 02
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules_batch02.py
      - name: Test O1 role-boundary capsules batch 03
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules_batch03.py
      - name: Test O1 role-boundary capsules batch 04
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules_batch04.py
      - name: Test O1 role-boundary capsules batch 05
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules_batch05.py
      - name: Test O1 role-boundary capsules batch 06
        run: python channels/elyxion-ufo-navigator/tools/test_o1_role_boundary_capsules_batch06.py
      - name: Test O2 relation batch 01
        run: python channels/elyxion-ufo-navigator/tools/test_o2_relation_batch01.py
      - name: Test O2 relation batch 02
        run: python channels/elyxion-ufo-navigator/tools/test_o2_relation_batch02.py
      - name: Test O2 relation batch 03
        run: python channels/elyxion-ufo-navigator/tools/test_o2_relation_batch03.py
      - name: Test O2 relation dependency index
        run: python channels/elyxion-ufo-navigator/tools/test_o2_relation_dependency_index.py
      - name: Test expanded global orientation
        run: python channels/elyxion-ufo-navigator/tools/test_global_orientation.py
      - name: Falsify global orientation blocking states
        run: python channels/elyxion-ufo-navigator/tools/test_global_orientation_blocking.py
      - name: Check upstream freshness
        run: python channels/elyxion-ufo-navigator/tools/check_nav_freshness.py --fail-on-stale
