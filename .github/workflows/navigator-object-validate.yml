name: Navigator Substrate Validate

on:
  push:
    branches:
      - channel/elyxion-ufo-navigator-v0.1
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  pull_request:
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Navigator substrate
        run: python channels/elyxion-ufo-navigator/tools/validate_nav_substrate_v0_3.py
      - name: Test bounded context slices
        run: python channels/elyxion-ufo-navigator/tools/test_context_slice.py
      - name: Test claim-aware context packs
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack.py
      - name: Test targeted context-pack invalidation
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack_invalidation.py
      - name: Test bounded evidence materialization
        run: python channels/elyxion-ufo-navigator/tools/test_materialize_evidence.py
      - name: Test receipts sufficiency and targeted repair
        run: python channels/elyxion-ufo-navigator/tools/test_receipt_and_repair.py
      - name: Test targeted context-pack repair planner
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack_repair.py
      - name: Test existing Global C0 handoff envelope
        run: python channels/elyxion-ufo-navigator/tools/test_global_c0_handoff.py
      - name: Test existing Global C0 cold-start export
        run: python channels/elyxion-ufo-navigator/tools/test_global_c0_cold_start_export.py
      - name: Check upstream freshness
        run: python channels/elyxion-ufo-navigator/tools/check_nav_freshness.py --fail-on-stale
