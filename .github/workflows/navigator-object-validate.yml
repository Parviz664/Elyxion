name: Navigator Substrate Validate

on:
  push:
    branches:
      - channel/elyxion-ufo-navigator-v0.1
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  pull_request:
    paths:
      - "channels/elyxion-ufo-navigator/**"
      - ".github/workflows/navigator-object-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Navigator substrate
        run: python channels/elyxion-ufo-navigator/tools/validate_nav_substrate_v0_2.py
      - name: Test bounded context slices
        run: python channels/elyxion-ufo-navigator/tools/test_context_slice.py
      - name: Test evidence-addressable context packs
        run: python channels/elyxion-ufo-navigator/tools/test_context_pack.py
      - name: Check upstream freshness
        run: python channels/elyxion-ufo-navigator/tools/check_nav_freshness.py --fail-on-stale
