name: COSMOS Lite v0.4.1 Starve Input Probe APK (isolated)

on:
  push:
    branches: [experiment/elyxion-cosmos-starve-webview-v04]
    paths:
      - 'experiments/COSMOS-Android/**'
      - '.github/workflows/cosmos-starve-input-v04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Java QA and Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/COSMOS-Android
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run independent input/core unit tests
        run: |
          bash qa/run-core-tests.sh
          bash qa/run-direction-tests.sh
      - name: Verify Android source manifest
        run: python3 qa/verify_package.py
      - name: Install Android API 35 using runner SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELYXION-COSMOS-Starve-Input-v0.4.1-debug-APK
          path: experiments/COSMOS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish directly downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT="ELYXION-COSMOS-Starve-v0.4.1-debug.apk"
          TAG="cosmos-starve-input-v0.4.1-preview"
          cp app/build/outputs/apk/debug/app-debug.apk "$ARTIFACT"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "ELYXION COSMOS Starve Input v0.4.1 (Android experiment)" \
              --notes "Experimental Android APK for manually testing Starve.io WebView input. This does not guarantee control compatibility with Starve.io or improve its network latency. Compiled from an isolated experiment branch; not an official Starve.io app. Debug-signed, not tested on the user's Samsung." \
              --prerelease
          fi
